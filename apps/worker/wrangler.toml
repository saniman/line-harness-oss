name = "line-harness"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true

routes = [
  { pattern = "api.walover-co.work", custom_domain = true }
]

# ═══════════════════════════════════════════════════════════════
# デフォルト = テスト環境 (noda@)
# 使い方: npx wrangler deploy
# ═══════════════════════════════════════════════════════════════
account_id = "aa7b3de8b8dc8dd263572893aa4f652e"

[assets]
directory = "dist/client"
binding = "ASSETS"
# ⚠️ run_worker_first = true を安易に足さないこと（2026-07-27 のレビューで検出）。
# これを付けると静的アセットも Worker を経由するが、middleware/auth.ts の
# スキップリストに `/`・`/assets/*`・`/menu` が無いため、`app.use('*', authMiddleware)`
# が notFound（= ASSETS.fetch）に届く前に 401 を返し、LIFF が全ユーザー真っ白になる。
# upstream で成立しているのは auth.ts に「/api/ 以外は素通し」ガードがあるため。
# OGP bot 対応で必要になったら、その auth ガード（cookie 認証刷新 #7 と関連）と
# 必ずセットで入れ、レート制限側の静的アセット除外も同時に行うこと。

[[d1_databases]]
binding = "DB"
database_name = "line-harness"
database_id = "b41a1c65-a224-41bc-a99a-3284b43ea440"
migrations_dir = "../../packages/db/migrations"

# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "line-harness-images"

[triggers]
crons = ["*/5 * * * *", "0 */6 * * *", "0 23 * * SUN", "0 23 * * WED"]  # 6h=booking expirer SUN=月曜08:00 JST(AIニュース) WED=木曜08:00 JST(プロンプト)

# Workers Logs（#49）。console.error だけのベストエフォート処理が「無音で失敗」しても
# 後から追えるようにする。イベント申込のメール通知が一度も動いていなかったのに
# 誰も気づけなかった事故（2026-09-02）の再発防止。
# head_sampling_rate = 1 は 100% 収集。この規模なら無料枠に収まる想定で、
# ログ量が増えたら下げる余地がある。
[observability]
enabled = true
head_sampling_rate = 1

[vars]
LIFF_BASE_URL = "https://liff.line.me/1661159603-5qlDj5wV"

# Stripe シークレット（wrangler secret put で設定する）
# STRIPE_SECRET_KEY        - Stripe ダッシュボード > APIキー
# STRIPE_WEBHOOK_SECRET    - Stripe ダッシュボード > Webhook > エンドポイントの署名シークレット

# freee シークレット（wrangler secret put で設定する）
# 詳細な取得手順: docs/setup/freee-setup.md
# FREEE_CLIENT_ID          - freee アプリストア > 開発者ページ > アプリ詳細
# FREEE_CLIENT_SECRET      - 同上
# FREEE_REDIRECT_URI       - 省略可。既定は https://api.walover-co.work/api/integrations/freee/callback

# ═══════════════════════════════════════════════════════════════
# 本番環境 (aiagent.mini@)
# 使い方: npx wrangler deploy --env production --name your-worker-name
# D1:     npx wrangler d1 execute line-crm --env production --remote --file ...
# ═══════════════════════════════════════════════════════════════
[env.production]
account_id = "YOUR_ACCOUNT_ID"

[env.production.assets]
directory = "dist/client"
binding = "ASSETS"
# run_worker_first は付けない（理由は上の [assets] のコメント参照）

[[env.production.d1_databases]]
binding = "DB"
database_name = "line-crm"
database_id = "YOUR_D1_DATABASE_ID"

[[env.production.r2_buckets]]
binding = "IMAGES"
bucket_name = "line-harness-images"

[env.production.observability]
enabled = true
head_sampling_rate = 1

[env.production.triggers]
crons = ["*/5 * * * *", "0 */6 * * *", "0 23 * * SUN", "0 23 * * WED"]  # 6h=booking expirer SUN=月曜08:00 JST(AIニュース) WED=木曜08:00 JST(プロンプト)
